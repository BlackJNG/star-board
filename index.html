<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12151c">
<title>星缘看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#12151c;color:#e8eaf0;overflow:hidden}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#181c26;border-bottom:1px solid #242a3a}
.top .l{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#3ddc84}
.title{font-size:16px;font-weight:600}
.sub{font-size:12px;color:#7b8398}
.page{position:absolute;inset:52px 0 0 0;display:flex;flex-direction:column}
#listPage{overflow-y:auto;-webkit-overflow-scrolling:touch}
.qwrap{padding:14px 14px 4px}
.qtitle{font-size:12px;color:#8b93ab;letter-spacing:1px;margin-bottom:10px}
.card{background:#1b2030;border:1px solid #3a4566;border-radius:14px;padding:15px;margin-bottom:12px}
.card .who{font-size:15px;font-weight:600;color:#ffc04d;margin-bottom:9px}
.card .quo{font-size:14px;color:#9aa2ba;background:#141926;border-left:3px solid #3d4768;border-radius:8px;padding:9px 11px;margin-bottom:11px;line-height:1.6}
.card .sug{font-size:16px;line-height:1.65;color:#e9ecf4;margin-bottom:9px}
.card .why{font-size:12px;color:#737b96;line-height:1.6;margin-bottom:13px}
.btns{display:flex;gap:9px}
button{font-family:inherit;font-size:15px;padding:12px 0;border-radius:11px;border:1px solid #333a52;background:#252d42;color:#cbd2e4;cursor:pointer;flex:1}
button.pri{background:#2f6df6;border-color:#2f6df6;color:#fff;font-weight:600}
button:active{opacity:.75}
.sect{font-size:12px;color:#8b93ab;letter-spacing:1px;padding:16px 16px 8px}
.conv{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #1e2432;background:#12151c}
.conv:active{background:#1a1f2c}
.ava{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:#252d42;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#8fa4d4}
.info{flex:1;min-width:0}
.nm{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:600}
.nm .tm{margin-left:auto;font-size:12px;color:#6b7389;font-weight:400}
.pv{font-size:13px;color:#7e869c;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;padding:2px 7px;border-radius:8px;background:#3a2020;color:#ff7b6b;font-weight:500}
.tag.w{background:#232a3c;color:#8b93ab}
#chatPage{display:none;background:#12151c}
#chatPage.on{display:flex}
.chead{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:10px;padding:0 8px 0 4px;background:#181c26;border-bottom:1px solid #242a3a}
.back{width:44px;height:44px;border:none;background:transparent;color:#8fa4d4;font-size:22px;line-height:1;flex:0 0 44px}
.cname{font-size:16px;font-weight:600}
.cstate{font-size:12px;color:#7b8398;margin-top:2px}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 28px;display:flex;flex-direction:column;gap:13px}
.row{display:flex}
.row.me{justify-content:flex-end}
.bub{max-width:82%;padding:11px 14px;border-radius:15px;font-size:15.5px;line-height:1.62;word-break:break-word}
.bub.them{background:#242b3d;color:#e0e4ef;border-top-left-radius:5px}
.bub.me{background:#2f6df6;color:#fff;border-top-right-radius:5px}
.bub .ts{display:block;font-size:11px;opacity:.55;margin-top:6px;text-align:right}
.sys{align-self:center;font-size:12px;color:#727a92;background:#1a1f2d;padding:6px 13px;border-radius:11px;max-width:86%;text-align:center;line-height:1.5}
.foot{padding:12px 14px 22px;background:#181c26;border-top:1px solid #242a3a}
.foot .tip{font-size:12px;color:#767e96;line-height:1.6;margin-top:10px}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(14px);background:#2f6df6;color:#fff;font-size:14px;padding:11px 20px;border-radius:22px;opacity:0;transition:.22s;pointer-events:none;z-index:50;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:520px){
  body{max-width:460px;margin:0 auto;border-left:1px solid #242a3a;border-right:1px solid #242a3a;position:relative}
}
</style>
</head>

const toastEl = document.getElementById('toast');
function toast(t){toastEl.textContent=t;toastEl.classList.add('on');setTimeout(()=>toastEl.classList.remove('on'),1700);}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast('已复制，去豆包粘贴');}).catch(function(){fallback(t);});
  } else { fallback(t); }
}
function fallback(t){
  var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity=0;
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制，去豆包粘贴');}catch(e){toast('复制失败，长按文字选中');}
  document.body.removeChild(ta);
}
function esc(s){return (s||'').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

(function(){
  var w=document.getElementById('qwrap');
  var pend=DATA.filter(function(c){return c.state==='待回'&&c.suggest;});
  if(!pend.length){
    w.innerHTML='<div class="qtitle">待回复</div><div style="font-size:14px;color:#737b96;padding:0 0 12px">目前没有待回消息，对方都还没动静。</div>';
    return;
  }
  w.innerHTML='<div class="qtitle">待你决定</div>';
  pend.forEach(function(c){
    var cmd='回复 '+c.name+'：'+c.suggest['建议'];
    var d=document.createElement('div');d.className='card';
    d.innerHTML='<div class="who">'+c.name+'</div>'+
      '<div class="quo">对方：'+esc(c.suggest['待回'])+'</div>'+
      '<div class="sug">'+esc(c.suggest['建议'])+'</div>'+
      '<div class="why">策略：'+esc(c.suggest['策略'])+'</div>'+
      '<div class="btns"><button class="pri">复制这句</button><button class="pass">这条不回</button></div>';
    d.querySelector('.pri').onclick=function(){copyText(cmd);};
    d.querySelector('.pass').onclick=function(){copyText('跳过 '+c.name+'，先不回');};
    w.appendChild(d);
  });
})();

(function(){
  var side=document.getElementById('side');
  DATA.forEach(function(c,i){
    var el=document.createElement('div');el.className='conv';
    var badge = c.state==='待回' ? '<span class="tag">待回</span>' : '';
    el.innerHTML='<div class="ava">'+c.name.slice(0,1)+'</div>'+
      '<div class="info"><div class="nm">'+c.name+badge+
      '<span class="tm">'+c.lastTime+'</span></div>'+
      '<div class="pv">'+esc(c.lastText)+'</div></div>';
    el.onclick=function(){openChat(i);};
    side.appendChild(el);
  });
})();

var foot=document.getElementById('foot');

    foot.querySelector('button').onclick=function(){copyText('回复 '+c.name+'：'+sug['建议']);};
  } else {
    foot.innerHTML='<div class="tip">这个会话你这边已经说完，等对方回。</div>';
  }
  listPage.style.display='none';
  chatPage.classList.add('on');
  setTimeout(function(){msgs.scrollTop=msgs.scrollHeight;},50);
}
document.getElementById('back').onclick=function(){chatPage.classList.remove('on');listPage.style.display='flex';};
</script>
</body>
</html>
