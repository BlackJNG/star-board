const toastEl = document.getElementById('toast');
function toast(t){toastEl.textContent=t;toastEl.classList.add('on');setTimeout(()=>toastEl.classList.remove('on'),1700);}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast('已复制，去豆包粘贴');}).catch(function(){fallback(t);});
  } else { fallback(t); }
}
function fallback(t){
  var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity=0;
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制，去豆包粘贴');}catch(e){toast('复制失败，长按文字选中');}
  document.body.removeChild(ta);
}
function esc(s){return (s||'').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

(function(){
  var w=document.getElementById('qwrap');
  var pend=DATA.filter(function(c){return c.state==='待回'&&c.suggest;});
  if(!pend.length){
    w.innerHTML='<div class="qtitle">待回复</div><div style="font-size:14px;color:#737b96;padding:0 0 12px">目前没有待回消息，对方都还没动静。</div>';
    return;
  }
  w.innerHTML='<div class="qtitle">待你决定</div>';
  pend.forEach(function(c){
    var cmd='回复 '+c.name+'：'+c.suggest['建议'];
    var d=document.createElement('div');d.className='card';
    d.innerHTML='<div class="who">'+c.name+'</div>'+
      '<div class="quo">对方：'+esc(c.suggest['待回'])+'</div>'+
      '<div class="sug">'+esc(c.suggest['建议'])+'</div>'+
      '<div class="why">策略：'+esc(c.suggest['策略'])+'</div>'+
      '<div class="btns"><button class="pri">复制这句</button><button class="pass">这条不回</button></div>';
    d.querySelector('.pri').onclick=function(){copyText(cmd);};
    d.querySelector('.pass').onclick=function(){copyText('跳过 '+c.name+'，先不回');};
    w.appendChild(d);
  });
})();

(function(){
  var side=document.getElementById('side');
  DATA.forEach(function(c,i){
    var el=document.createElement('div');el.className='conv';
    var badge = c.state==='待回' ? '<span class="tag">待回</span>' : '';
    el.innerHTML='<div class="ava">'+c.name.slice(0,1)+'</div>'+
      '<div class="info"><div class="nm">'+c.name+badge+
      '<span class="tm">'+c.lastTime+'</span></div>'+
      '<div class="pv">'+esc(c.lastText)+'</div></div>';
    el.onclick=function(){openChat(i);};
    side.appendChild(el);
  });
})();

var listPage=document.getElementById('listPage');
var chatPage=document.getElementById('chatPage');
var msgs=document.getElementById('msgs');
var foot=document.getElementById('foot');

function openChat(i){
  var c=DATA[i];
  document.getElementById('cName').textContent=c.name;
  document.getElementById('cState').textContent = c.state==='待回' ? '对方刚发来 · 等你决定' : '你已说完 · 等对方';
  msgs.innerHTML='';
  c.msgs.forEach(function(m){
    if(m.t.indexOf('你好，我是通过「捞个在线」')===0){
      var s=document.createElement('div');s.className='sys';s.textContent='通过「捞个在线」发起的聊天';msgs.appendChild(s);return;
    }
    var row=document.createElement('div');row.className='row '+(m.s?'me':'');
    var b=document.createElement('div');b.className='bub '+(m.s?'me':'them');
    b.innerHTML=esc(m.t)+'<span class="ts">'+m.time+'</span>';
    row.appendChild(b);msgs.appendChild(row);
  });
  var sug=c.suggest;
  if(sug){
    foot.innerHTML='<button class="pri" style="width:100%;font-size:16px;padding:14px 0;border-radius:12px;border:1px solid #2f6df6;background:#2f6df6;color:#fff;font-weight:600">复制这句回复</button><div class="tip">建议：'+esc(sug['建议'])+'</div>';
    foot.querySelector('button').onclick=function(){copyText('回复 '+c.name+'：'+sug['建议']);};
  } else {
    foot.innerHTML='<div class="tip">这个会话你这边已经说完，等对方回。</div>';
  }
  listPage.style.display='none';
  chatPage.classList.add('on');
  setTimeout(function(){msgs.scrollTop=msgs.scrollHeight;},50);
}
document.getElementById('back').onclick=function(){chatPage.classList.remove('on');listPage.style.display='flex';};

const CFG_RAW='https://raw.githubusercontent.com/BlackJNG/star-board/main/config.json';
const CFG_API='https://api.github.com/repos/BlackJNG/star-board/contents/config.json';
const swMap={sw_reply:'auto_reply',sw_pick:'auto_pick',sw_match:'auto_match'};
let cfgSha=null, cfgNow={};
function tokGet(){return localStorage.getItem('ghtok')||'';}
async function loadCfg(){
  try{
    const r=await fetch(CFG_RAW+'?t='+Date.now()); const j=await r.json();
    cfgNow=j;
    for(const [id,k] of Object.entries(swMap)){ const el=document.getElementById(id); if(el) el.checked=!!j[k]; }
  }catch(e){}
}
async function saveCfg(){
  const t=tokGet();
  if(!t){ document.querySelector('.swkey').classList.add('on'); toast('先粘一次 token'); return; }
  const body={auto_reply:document.getElementById('sw_reply').checked,
              auto_pick:document.getElementById('sw_pick').checked,
              auto_match:document.getElementById('sw_match').checked,
              female_only:true, picks_per_round:cfgNow.picks_per_round||20,
              greet_new:true, match_gender:'female', match_age_min:18, match_age_max:45};
  try{
    let sha=cfgSha;
    if(!sha){ const r=await fetch(CFG_API,{headers:{Authorization:'token '+t}}); if(r.ok){ sha=(await r.json()).sha; } }
    const r2=await fetch(CFG_API,{method:'PUT',headers:{Authorization:'token '+t,'Content-Type':'application/json'},
      body:JSON.stringify({message:'toggle '+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(JSON.stringify(body,null,2)))),sha})});
    if(r2.ok){ cfgSha=(await r2.json()).content.sha; cfgNow=body; toast('已保存，机器人 2 分钟内生效'); }
    else { toast('保存失败 '+(await r2.json()).message); }
  }catch(e){ toast('网络错误'); }
}
for(const id of Object.keys(swMap)){ const el=document.getElementById(id); if(el) el.addEventListener('change',saveCfg); }
document.getElementById('saveTok').addEventListener('click',()=>{ const v=document.getElementById('ghtok').value.trim();
  if(v){ localStorage.setItem('ghtok',v); document.querySelector('.swkey').classList.remove('on'); toast('token 已保存'); saveCfg(); } });
loadCfg();
</script>
